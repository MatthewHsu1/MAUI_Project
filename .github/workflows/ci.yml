name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet-tests:
    name: dotnet-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The MAUI host project (src/AppName.Maui) is intentionally not built here:
      # it requires the MAUI workload + platform SDKs. The platform-neutral layers
      # (Domain / Application / Infrastructure) carry the unit tests and build on
      # a plain runner.
      - name: Test Domain
        run: dotnet test tests/AppName.Domain.Tests/AppName.Domain.Tests.csproj --configuration Release

      - name: Test Application
        run: dotnet test tests/AppName.Application.Tests/AppName.Application.Tests.csproj --configuration Release

      - name: Test Infrastructure
        run: dotnet test tests/AppName.Infrastructure.Tests/AppName.Infrastructure.Tests.csproj --configuration Release

  web-tests:
    name: web-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Builds the MAUI host (src/AppName.Maui) per target platform. Each platform's
  # SDK is only available on certain OSes: iOS and MacCatalyst require Xcode on a
  # macOS runner, Windows (WinUI) requires the Windows SDK on a windows runner, and
  # Android can build anywhere but is included here too. This is why these builds
  # can't run on the single ubuntu runner used by dotnet-tests above.
  maui-build:
    name: maui-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tfm: net10.0-android
            workload: maui-android
          - os: windows-latest
            tfm: net10.0-windows10.0.19041.0
            workload: maui-windows
          - os: macos-latest
            tfm: net10.0-ios
            workload: maui-ios
          - os: macos-latest
            tfm: net10.0-maccatalyst
            workload: maui-maccatalyst
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install MAUI workload (${{ matrix.workload }})
        run: dotnet workload install ${{ matrix.workload }}

      - name: Build MAUI head (${{ matrix.tfm }})
        run: dotnet build src/AppName.Maui/AppName.Maui.csproj -f ${{ matrix.tfm }} -p:TargetFrameworks=${{ matrix.tfm }} -c Release
