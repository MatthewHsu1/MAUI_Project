name: CI

on:
  pull_request:
    branches: [main]

jobs:
  dotnet-tests:
    name: dotnet-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The MAUI host project (src/AppName.Maui) is intentionally not built here:
      # it requires the MAUI workload + platform SDKs. The platform-neutral layers
      # (Domain / Application / Infrastructure) carry the unit tests and build on
      # a plain runner.
      - name: Test Domain
        run: dotnet test tests/AppName.Domain.Tests/AppName.Domain.Tests.csproj --configuration Release

      - name: Test Application
        run: dotnet test tests/AppName.Application.Tests/AppName.Application.Tests.csproj --configuration Release

      - name: Test Infrastructure
        run: dotnet test tests/AppName.Infrastructure.Tests/AppName.Infrastructure.Tests.csproj --configuration Release

  web-tests:
    name: web-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # src/routeTree.gen.ts is generated but committed, and carries
      # @ts-nocheck — so a deleted route file with a stale tree still type
      # checks. The build above regenerates it; this fails if that produced
      # a diff, which is the only signal that the committed tree is stale.
      - name: Generated route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts

  # Builds the MAUI host (src/AppName.Maui) per target platform. Each platform's
  # SDK is only available on certain OSes: iOS and MacCatalyst require Xcode on a
  # macOS runner, Windows (WinUI) requires the Windows SDK on a windows runner, and
  # Android can build anywhere but is included here too. This is why these builds
  # can't run on the single ubuntu runner used by dotnet-tests above.
  maui-build:
    name: maui-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tfm: net10.0-android
          - os: windows-latest
            tfm: net10.0-windows10.0.19041.0
          - os: macos-26
            tfm: net10.0-ios
          - os: macos-26
            tfm: net10.0-maccatalyst
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install MAUI workloads
        run: dotnet workload restore src/AppName.Maui/AppName.Maui.csproj

      - name: Build MAUI head (${{ matrix.tfm }})
        run: dotnet build src/AppName.Maui/AppName.Maui.csproj -f ${{ matrix.tfm }} -c Release
